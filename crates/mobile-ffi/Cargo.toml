[package]
name = "annoda-mobile-ffi"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
annoda-core = { path = "../core" }
annoda-intelligence = { path = "../intelligence" }
annoda-network = { path = "../network" }
postcard = { version = "1.1", features = ["alloc"] }
thiserror = "2"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
uniffi = "0.32.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
